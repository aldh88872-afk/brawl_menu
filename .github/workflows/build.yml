name: Build APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 7.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip
          unzip -q gradle-7.6-bin.zip
          export PATH=$PWD/gradle-7.6/bin:$PATH
          gradle wrapper --gradle-version 7.6
          chmod +x gradlew
          echo "PATH=$PWD/gradle-7.6/bin:$PATH" >> $GITHUB_ENV

      - name: Build APK
        run: ./gradlew assembleDebug --info 2>&1 | tail -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brawl-menu
          path: app/build/outputs/apk/debug/app-debug.apk
